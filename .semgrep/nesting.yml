# Enforces AGENTS.md "maximum control-flow nesting depth: 2".
# Generated: cross-product of nested if/for/while/loop/match at 3 levels.
# A single explicit 3-level pattern is used per combination because
# semgrep's `pattern-inside` treats a node as nested within itself and
# would fire on every single statement.
rules:
  - id: rust-no-control-flow-nesting-above-2
    languages:
      - rust
    message: "Control-flow nesting exceeds maximum depth of 2; extract a helper function"
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: "if $IF1 { ... if $IF2 { ... if $IF3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... if $IF2 { ... for $FORA3 in $FORB3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... if $IF2 { ... while $WH3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... if $IF2 { ... loop { ... } ... } ... }"
          - pattern: "if $IF1 { ... if $IF2 { ... match $MT3 { $ARM3 => { ... } } ... } ... }"
          - pattern: "if $IF1 { ... for $FORA2 in $FORB2 { ... if $IF3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... for $FORA2 in $FORB2 { ... for $FORA3 in $FORB3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... for $FORA2 in $FORB2 { ... while $WH3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... for $FORA2 in $FORB2 { ... loop { ... } ... } ... }"
          - pattern: "if $IF1 { ... for $FORA2 in $FORB2 { ... match $MT3 { $ARM3 => { ... } } ... } ... }"
          - pattern: "if $IF1 { ... while $WH2 { ... if $IF3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... while $WH2 { ... for $FORA3 in $FORB3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... while $WH2 { ... while $WH3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... while $WH2 { ... loop { ... } ... } ... }"
          - pattern: "if $IF1 { ... while $WH2 { ... match $MT3 { $ARM3 => { ... } } ... } ... }"
          - pattern: "if $IF1 { ... loop { ... if $IF3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... loop { ... for $FORA3 in $FORB3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... loop { ... while $WH3 { ... } ... } ... }"
          - pattern: "if $IF1 { ... loop { ... loop { ... } ... } ... }"
          - pattern: "if $IF1 { ... loop { ... match $MT3 { $ARM3 => { ... } } ... } ... }"
          - pattern: "if $IF1 { ... match $MT2 { $ARM2 => { ... if $IF3 { ... } ... } } ... }"
          - pattern: "if $IF1 { ... match $MT2 { $ARM2 => { ... for $FORA3 in $FORB3 { ... } ... } } ... }"
          - pattern: "if $IF1 { ... match $MT2 { $ARM2 => { ... while $WH3 { ... } ... } } ... }"
          - pattern: "if $IF1 { ... match $MT2 { $ARM2 => { ... loop { ... } ... } } ... }"
          - pattern: "if $IF1 { ... match $MT2 { $ARM2 => { ... match $MT3 { $ARM3 => { ... } } ... } } ... }"
          - pattern: "for $FORA1 in $FORB1 { ... if $IF2 { ... if $IF3 { ... } ... } ... }"
          - pattern: "for $FORA1 in $FORB1 { ... if $IF2 { ... for $FORA3 in $FORB3 { ... } ... } ... }"
          - pattern: "for $FORA1 in $FORB1 { ... if $IF2 { ... while $WH3 { ... } ... } ... }"
          - pattern: "for $FORA1 in $FORB1 { ... if $IF2 { ... loop { ... } ... } ... }"

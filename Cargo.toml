[package]
name = "localnar"
description = "Local model manager: discovers models in a remote catalog, installs them into a durable on-disk library, and lists, inspects, verifies, removes, and prunes that library."
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
application = { workspace = true }
infrastructure = { workspace = true }
presentation = { workspace = true }
tokio = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }

[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["gbrennon"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
presentation = { path = "crates/presentation" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "cargo"] }
hf-hub = { version = "0.4", features = ["tokio"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"

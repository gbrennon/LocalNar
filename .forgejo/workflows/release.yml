name: Release

on:
  pull_request:
    types: [closed]

jobs:
  publish:
    name: Publish to crates.io
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/v')
    runs-on: codeberg-medium
    steps:
      - name: Enforce release branch naming
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release branch '${HEAD_REF}' must match release/v<major>.<minor>.<patch>" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.forgejo/actions/install-rust
      - uses: ./.forgejo/actions/publish
        with:
          mode: production
          api-key: ${{ secrets.CRATES_IO_TOKEN }}

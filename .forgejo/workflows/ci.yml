name: CI

on:
  push:
    branches:
      - main
      - develop
      - release/**
  pull_request:
    branches:
      - main
      - develop
      - release/**

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v7

      - uses: ./.forgejo/actions/install-rust

      - uses: ./.forgejo/actions/verify

  validate:
    name: Validate
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v7

      - uses: ./.forgejo/actions/install-just

      - uses: ./.forgejo/actions/install-lint-tools

      - name: Lint shell scripts
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          just lint-scripts

      - name: Lint workflows
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          just lint-workflows

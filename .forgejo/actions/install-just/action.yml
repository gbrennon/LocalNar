name: Install just
description: Install the just task runner into the runner PATH.

inputs:
  version:
    description: just release version to install.
    default: '1.58.0'

runs:
  using: composite
  steps:
    - name: Install just
      shell: bash
      env:
        JUST_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        just_version="${JUST_VERSION:-1.58.0}"

        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"

        if command -v just >/dev/null 2>&1; then
          just --version
          exit 0
        fi

        case "$(uname -m)" in
          x86_64) target="x86_64-unknown-linux-musl" ;;
          aarch64) target="aarch64-unknown-linux-musl" ;;
          *)
            echo "unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        curl -fsSL --proto '=https' --tlsv1.2 \
          -o /tmp/just.tar.gz \
          "https://github.com/casey/just/releases/download/${just_version}/just-${just_version}-${target}.tar.gz"
        tar -xzf /tmp/just.tar.gz -C /tmp just
        install -m 0755 /tmp/just "$HOME/.local/bin/just"
        rm -f /tmp/just.tar.gz /tmp/just
        just --version
